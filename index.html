<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CO 차이분석 집계기</title>

<!-- [GTM] 컨테이너 ID를 본인 것으로 교체 (head 스니펫) -->
<script>
window.dataLayer = window.dataLayer || [];
(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-52TFLLL7');
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body{font-family:-apple-system,"Malgun Gothic",sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;color:#222}
  h1{font-size:20px}
  .box{border:1px solid #ddd;border-radius:8px;padding:14px;margin:12px 0}
  label{display:inline-block;margin:4px 12px 4px 0;font-size:14px}
  select,input[type=number]{padding:4px}
  button{padding:8px 14px;border:0;border-radius:6px;background:#1a56db;color:#fff;cursor:pointer;margin-right:6px}
  button:disabled{background:#999;cursor:not-allowed}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
  th,td{border:1px solid #ddd;padding:5px 8px;text-align:right}
  th{background:#f3f4f6}
  td.l,th.l{text-align:left}
  tr.flag td{background:#fff1f0}
  .muted{color:#666;font-size:13px}
</style>
</head>
<body>
<!-- [GTM] body 스니펫 (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-52TFLLL7" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<h1>CO 차이분석 집계기</h1>
<p class="muted">엑셀/CSV를 올리면 선택한 기준으로 계획·실적·차이를 집계합니다. 파일은 브라우저 안에서만 처리되며 서버로 전송되지 않습니다. (분석 이벤트에는 파일 내용이 아닌 행 수 등 메타데이터만 담습니다.)</p>

<div class="box">
  <input type="file" id="file" accept=".xlsx,.xls,.csv" data-track="file_input">
  <span id="fileInfo" class="muted"></span>
</div>

<div class="box" id="mapBox" style="display:none">
  <div>
    <label>집계 기준 1 <select id="key1"></select></label>
    <label>집계 기준 2 (선택) <select id="key2"></select></label>
  </div>
  <div>
    <label>계획금액 컬럼 <select id="planCol"></select></label>
    <label>실적금액 컬럼 <select id="actCol"></select></label>
  </div>
  <div>
    <label>차이율 임계치(%) <input type="number" id="thPct" value="10" style="width:70px"></label>
    <label>절대차이 임계치 <input type="number" id="thAbs" value="1000000" style="width:120px"></label>
  </div>
  <button id="runBtn" data-track="aggregate_run">집계 실행</button>
  <button id="dlBtn" data-track="download_result" disabled>결과 엑셀 다운로드</button>
</div>

<div class="box" id="resultBox" style="display:none">
  <div id="summary"></div>
  <div style="overflow-x:auto"><table id="resultTable"></table></div>
</div>

<script>
let rows = [], headers = [], result = [];

function track(eventName, params){
  window.dataLayer.push(Object.assign({event: eventName}, params || {}));
}

function toNum(v){
  if (typeof v === 'number') return v;
  if (v === null || v === undefined || v === '') return 0;
  const n = Number(String(v).replace(/[, ]/g,''));
  return isNaN(n) ? 0 : n;
}

document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  rows = XLSX.utils.sheet_to_json(ws, {defval:''});
  headers = rows.length ? Object.keys(rows[0]) : [];
  document.getElementById('fileInfo').textContent = ` ${f.name} / ${rows.length}행 / ${headers.length}컬럼 (첫 시트 기준)`;
  fillSelects();
  document.getElementById('mapBox').style.display = rows.length ? 'block' : 'none';
  track('file_upload', {row_count: rows.length, col_count: headers.length, file_ext: f.name.split('.').pop().toLowerCase()});
});

function label(h){ return /^__EMPTY/.test(h) ? `(이름 없는 컬럼 ${h})` : h; }

function fillSelects(){
  const opts = headers.map(h => `<option value="${h.replace(/"/g,'&quot;')}">${label(h)}</option>`).join('');
  const ph = '<option value="">-- 선택하세요 --</option>';
  document.getElementById('key1').innerHTML = ph + opts;
  document.getElementById('key2').innerHTML = '<option value="">(없음)</option>' + opts;
  document.getElementById('planCol').innerHTML = ph + opts;
  document.getElementById('actCol').innerHTML = ph + opts;
  // 헤더 이름으로 자동 추정 (못 찾으면 비워 두고 사용자가 직접 선택)
  headers.forEach(h => {
    if (/계획|plan|budget/i.test(h)) document.getElementById('planCol').value = h;
    if (/실적|actual/i.test(h)) document.getElementById('actCol').value = h;
  });
}

function numericRatio(col){
  const sample = rows.slice(0, 1000);
  if (!sample.length) return 0;
  const ok = sample.filter(r => r[col] !== '' && r[col] !== null && !isNaN(Number(String(r[col]).replace(/[, ]/g,'')))).length;
  return ok / sample.length;
}

document.getElementById('runBtn').addEventListener('click', () => {
  const k1 = document.getElementById('key1').value;
  const k2 = document.getElementById('key2').value;
  const pc = document.getElementById('planCol').value;
  const ac = document.getElementById('actCol').value;
  const thPct = Number(document.getElementById('thPct').value);
  const thAbs = Number(document.getElementById('thAbs').value);

  if (!k1 || !pc || !ac) { alert('집계 기준 1, 계획금액, 실적금액 컬럼을 모두 선택하세요.'); return; }
  if (pc === ac) { alert('계획금액과 실적금액에 같은 컬럼이 선택되었습니다. 서로 다른 컬럼을 선택하세요.'); return; }
  const bad = [pc, ac].filter(c => numericRatio(c) < 0.9);
  if (bad.length) { alert('숫자가 아닌 값이 많은 컬럼입니다: ' + bad.map(label).join(', ') + '\n금액 컬럼이 맞는지 확인하세요.'); return; }

  const map = new Map();
  rows.forEach(r => {
    const key = k2 ? `${r[k1]}||${r[k2]}` : String(r[k1]);
    if (!map.has(key)) map.set(key, {k1: r[k1], k2: k2 ? r[k2] : '', plan:0, act:0});
    const o = map.get(key);
    o.plan += toNum(r[pc]);
    o.act += toNum(r[ac]);
  });

  result = [...map.values()].map(o => {
    const diff = o.act - o.plan;
    const pct = o.plan === 0 ? null : diff / o.plan * 100;
    const flag = Math.abs(diff) >= thAbs && (pct === null || Math.abs(pct) >= thPct);
    return {...o, diff, pct, flag};
  }).sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));

  render(k1, k2);
  document.getElementById('dlBtn').disabled = false;
  track('aggregate_complete', {group_count: result.length, flagged_count: result.filter(r=>r.flag).length});
});

function fmt(n){ return n.toLocaleString('ko-KR', {maximumFractionDigits:0}); }

function render(k1, k2){
  const totPlan = result.reduce((s,r)=>s+r.plan,0);
  const totAct = result.reduce((s,r)=>s+r.act,0);
  const flagged = result.filter(r=>r.flag).length;
  document.getElementById('summary').innerHTML =
    `<b>결론:</b> 전체 계획 ${fmt(totPlan)} 대비 실적 ${fmt(totAct)} (차이 ${fmt(totAct-totPlan)}), 임계치 초과 ${flagged}건 / 전체 ${result.length}건`;
  let h = `<tr><th class="l">${k1}</th>` + (k2 ? `<th class="l">${k2}</th>` : '') +
          `<th>계획</th><th>실적</th><th>차이</th><th>차이율(%)</th><th>임계치 초과</th></tr>`;
  result.forEach(r => {
    h += `<tr class="${r.flag?'flag':''}"><td class="l">${r.k1}</td>` + (k2 ? `<td class="l">${r.k2}</td>` : '') +
         `<td>${fmt(r.plan)}</td><td>${fmt(r.act)}</td><td>${fmt(r.diff)}</td>` +
         `<td>${r.pct===null?'계획 없음':r.pct.toFixed(1)}</td><td>${r.flag?'Y':''}</td></tr>`;
  });
  document.getElementById('resultTable').innerHTML = h;
  document.getElementById('resultBox').style.display = 'block';
}

document.getElementById('dlBtn').addEventListener('click', () => {
  const k1 = document.getElementById('key1').value;
  const k2 = document.getElementById('key2').value;
  const out = result.map(r => {
    const o = {};
    o[k1] = r.k1;
    if (k2) o[k2] = r.k2;
    o['계획'] = r.plan; o['실적'] = r.act; o['차이'] = r.diff;
    o['차이율(%)'] = r.pct === null ? '계획 없음' : Number(r.pct.toFixed(2));
    o['임계치 초과'] = r.flag ? 'Y' : '';
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(out);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '차이분석');
  XLSX.writeFile(wb, 'co_variance_result.xlsx');
  track('file_download', {row_count: out.length});
});

// data-track 속성이 있는 요소의 클릭을 GTM으로 전달
document.addEventListener('click', e => {
  const el = e.target.closest('[data-track]');
  if (el) track('ui_click', {ui_name: el.getAttribute('data-track')});
});
</script>
</body>
</html>
